<title>Orbit Hopper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{--bg:#e9e6ff;--fg:#1b1740;--dim:#6a6590;--accent:#ff5d8f;--void:#1b1740;--star:#8d87c9;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a1f;--fg:#f2f0ff;--dim:#9a96c8;--accent:#ff7aa5;--void:#3a1450;--star:#ffffff}}

html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:color-mix(in srgb,var(--bg) 70%,transparent)}

@keyframes tline{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.onl{display:inline-flex;align-items:center;gap:7px;margin:0 0 8px;padding:5px 13px;border-radius:999px;font:600 13px system-ui,sans-serif;background:color-mix(in srgb,var(--fg) 7%,transparent);cursor:pointer;user-select:none}

.hint:active{transform:scale(.98)}
.hint:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint b{display:block;font-size:12px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.hint span{display:block;margin-top:3px}
.hint small{display:block;margin-top:4px;color:var(--dim);font-size:11px}
.hint.dn{opacity:.6}.hint.dn b{color:#3ddc84}

/* ===== PC SKINS SCREEN ===== */
.skpc{width:100%;display:flex;gap:24px;align-items:stretch;height:calc(100vh - 48px);max-height:760px;text-align:left}
.skl{width:340px;flex:none;overflow-y:auto;padding:10px;border-radius:24px;border:1.5px solid color-mix(in srgb,var(--fg) 14%,transparent);background:color-mix(in srgb,var(--fg) 5%,transparent);scrollbar-width:thin}

.skmenu{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:160px;padding:6px;border-radius:16px;z-index:5;background:var(--bg);border:1.5px solid color-mix(in srgb,var(--fg) 18%,transparent);box-shadow:0 10px 30px #0006;text-align:left}

.skch{display:flex;flex-wrap:wrap;gap:8px;width:272px;justify-content:center;margin:8px 0}
.skch div{padding:9px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;background:color-mix(in srgb,var(--fg) 7%,transparent);border:1.5px solid color-mix(in srgb,var(--fg) 14%,transparent)}

#skh{margin:10px 0}
@media (max-width:899px){.skpc .skl{width:290px}}
#skn{display:none;margin:8px 0}
</style>

<script>

const ua=navigator.userAgent||'',uad=navigator.userAgentData,mtp=navigator.maxTouchPoints||0;

DEVICE.type=t;

var CLOUD='',cT=0,cloudMsg='',cloudBack='set',cloudName='';

function banner(f,t){let b=document.getElementById('bc');if(!b){b=document.createElement('div');b.id='bc';b.style.cssText='position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,#0b1226ee,#10213fee);border:1px solid #4dd8ff88;color:#e8f6ff;font:600 15px/1.35 system-ui,sans-serif;text-align:center;box-shadow:0 6px 24px #0007,0 0 22px #4dd8ff44;backdrop-filter:blur(8px);pointer-events:none;transition:opacity .3s';document.body.appendChild(b)}b.textContent='\u{1F4E3} '+f+': '+tr(t);b.style.opacity=1;clearTimeout(b._t);b._t=setTimeout(()=>b.style.opacity=0,9000);beep(660,.15)}
