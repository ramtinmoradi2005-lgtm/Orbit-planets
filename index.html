.term .cin{display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--t-line);background:#0a1020}
.term .cin b{color:var(--t-cy);font:700 15px ui-monospace,monospace}
#ov .term input{flex:1;min-width:0;height:40px;border:0;outline:0;background:none;box-shadow:none;color:var(--t-tx);caret-color:var(--t-cy);font:14px ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:0}

@keyframes tline{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
