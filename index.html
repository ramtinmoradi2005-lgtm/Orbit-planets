<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Hopper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{--bg:#e9e6ff;--fg:#1b1740;--dim:#6a6590;--accent:#ff5d8f;--void:#1b1740;--star:#8d87c9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a1f;--fg:#f2f0ff;--dim:#9a96c8;--accent:#ff7aa5;--void:#3a1450;--star:#ffffff}}
:root[data-theme="dark"]{--bg:#0b0a1f;--fg:#f2f0ff;--dim:#9a96c8;--accent:#ff7aa5;--void:#3a1450;--star:#ffffff}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:14px 18px;font-weight:700;pointer-events:none}
#score{font-size:44px;line-height:1}
#cb{position:fixed;left:18px;top:calc(env(safe-area-inset-top,0px) + 66px);font:700 20px "Space Grotesk",system-ui,sans-serif;color:var(--accent);opacity:0;transition:opacity .2s,transform .15s;transform-origin:left center;pointer-events:none}
#best{font-size:14px;color:var(--dim);padding-top:6px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
#ov h1{font:700 38px/1.05 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.03em;margin:10px 0 8px}
#ov p{margin:4px 0;color:var(--dim);max-width:280px;line-height:1.4}
.hero{width:92px;height:92px;color:var(--fg)}
.btn{display:flex;align-items:center;gap:12px;margin:6px 0;width:272px;box-sizing:border-box;padding:8px 18px 8px 8px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent);border:1.5px solid color-mix(in srgb,var(--fg) 14%,transparent);font-weight:600;font-size:16px;cursor:pointer;text-align:left;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 10%,transparent);flex:none}
.btn .lb{flex:1}
.btn .rt{color:var(--dim);font-size:14px;display:flex;align-items:center;gap:4px}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff;font-size:20px;margin-top:18px;justify-content:center;padding:12px 22px}
.btn.pri .ic{background:none;width:auto;height:auto}
.btn.pri .lb{flex:none}
.btn.off{opacity:.6}
#ov{animation:fade .25s ease-out;transition:background-color .35s}
#ov.main{background:color-mix(in srgb,var(--bg) 30%,transparent)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes sink{to{opacity:0;transform:translateY(-10px) scale(.98)}}
#ov>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
#ov.still>*{animation:none}
#ov.out>*{animation:sink .14s ease-in both;animation-delay:0s}
@media (prefers-reduced-motion:reduce){#ov,#ov>*{animation:none!important}}
.sw{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 55%),var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
#ov textarea,#ov input{width:272px;box-sizing:border-box;height:74px;margin:8px 0;padding:10px 12px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--fg) 14%,transparent);background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg);font:12px/1.3 ui-monospace,monospace;resize:none;-webkit-user-select:text;user-select:text;word-break:break-all}
#ov{overflow-y:auto;justify-content:flex-start}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
.demo{width:170px;height:auto;color:var(--fg);flex:none}
.keys{display:flex;align-items:center;gap:8px;margin:2px 0 10px;color:var(--dim);font-size:14px}
.keys span{padding:6px 14px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--fg) 18%,transparent);background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg);font-weight:700;box-shadow:0 3px 0 color-mix(in srgb,var(--fg) 18%,transparent)}
.keys i{font-style:normal}
#ov .lbl{width:272px;margin:4px 0}
.lr{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:4px 0;border-radius:12px;background:color-mix(in srgb,var(--fg) 7%,transparent);font-weight:600;text-align:left}
.lr b{width:22px;color:var(--dim)}.lr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lr em{font-style:normal;color:var(--accent)}
.lr.me{outline:1.5px solid var(--accent)}
#ov .lbs{font-size:13px;margin:2px 0 6px}
#pb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:16px;width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--fg) 12%,transparent);display:none;place-items:center;cursor:pointer}
#ov input{height:42px;font:14px ui-monospace,monospace;word-break:normal}
.clog{width:272px;box-sizing:border-box;max-height:150px;overflow-y:auto;text-align:left;font:12px/1.5 ui-monospace,monospace;color:var(--dim);padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--fg) 7%,transparent);-webkit-user-select:text;user-select:text;word-break:break-word}
.otag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.08em;vertical-align:middle}
.clog div{margin:2px 0}.clog .in{color:var(--fg)}.clog .err{color:var(--accent)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="best"></div></div>
<div id="cb"></div><div id="ov"></div><div id="pb" role="button" aria-label="Pause"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),sc=document.getElementById('score'),bs=document.getElementById('best');
let W,H,dpr,col={};
function readCols(){const s=getComputedStyle(document.documentElement);['bg','fg','accent','void','star'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);readCols()}
addEventListener('resize',resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readCols,50));
resize();
let OWN=0,OWN_UNTIL=0,GOD=0,OTAG='OWNER',lbMode='classic',lbScope='global',CL=null,cmdLog=[{k:'info',t:'Type /help for commands.'}];
try{CL=JSON.parse(localStorage.getItem('orbitOwnerV2')||'null');OTAG=localStorage.getItem('orbitTag')||'OWNER';OWN_UNTIL=+localStorage.getItem('orbitOwn')||0}catch(e){}
OWN=CL&&OWN_UNTIL>Date.now()?1:0;
function chk(){if(OWN&&Date.now()>OWN_UNTIL){OWN=0;GOD=0;try{localStorage.removeItem('orbitOwn')}catch(e){}if(gb('classic')<UN[S.skin])S.skin=0}}
const cleanName=n=>String(n||'').replace(/[^\w .\-]/g,'').trim().slice(0,14);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='orbitSave';let DB={S:{},c:0,z:0,L:{classic:[],zen:[]}},codeMsg='';
function cleanRows(r){return Array.isArray(r)?r.filter(x=>x&&typeof x==='object'&&+x.v>0).map(x=>({n:cleanName(x.n)||'Player',v:Math.floor(+x.v),o:CL&&x.o?1:0,t:+x.t||0})):[]}
function mgL(d){if(!d||!d.L||typeof d.L!=='object')return;for(const m of['classic','zen']){const seen=new Set();DB.L[m]=DB.L[m].concat(cleanRows(d.L[m])).filter(x=>{const k=x.t+'|'+x.v+'|'+x.n;if(seen.has(k))return 0;seen.add(k);return 1}).sort((p,q)=>q.v-p.v||p.t-q.t).slice(0,10)}}
function addRun(){const L=DB.L[S.mode==='zen'?'zen':'classic'];L.push({n:S.name||'Player',v:score,o:OWN?1:0,t:Date.now()});L.sort((p,q)=>q.v-p.v||p.t-q.t);L.length=Math.min(L.length,10)}
let GDB=null,GROWS=[],gUid=null,cmdBack='set',lastB='',lastF='',nameDraft='',nameErr='';
function banner(f,t){let b=document.getElementById('bc');if(!b){b=document.createElement('div');b.id='bc';b.style.cssText='position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;padding:12px 16px;border-radius:16px;background:var(--accent);color:#fff;font:600 15px/1.35 system-ui,sans-serif;text-align:center;box-shadow:0 6px 24px #0005;pointer-events:none;transition:opacity .3s';document.body.appendChild(b)}b.textContent='\u{1F4E3} '+f+': '+t;b.style.opacity=1;clearTimeout(b._t);b._t=setTimeout(()=>b.style.opacity=0,9000);beep(660,.15)}
function pushG(){if(!GDB||!gUid||GOD)return;GDB.doc('lb/'+gUid).set({n:S.name||'Player',c:DB.c,z:DB.z,t:Date.now()}).catch(()=>{})}
(async()=>{try{const u=await claude.use('user');gUid=u?await u.id():null;GDB=await claude.use('db');if(GDB){if(gUid&&(DB.c||DB.z))pushG();GDB.doc('broadcast/fx').onSnapshot(q=>{const d=q.data&&q.data();if(!d||!d.id)return;if(d.id!==lastF&&Date.now()-d.t<8e3)fxRun(String(d.k),d.x?String(d.x).slice(0,140):'');lastF=d.id},()=>{});GDB.doc('broadcast/latest').onSnapshot(q=>{const d=q.data&&q.data();if(!d||!d.id)return;if(d.id!==lastB&&d.text&&Date.now()-d.t<12e4)banner(String(d.from||'Owner').slice(0,14),String(d.text).slice(0,140));lastB=d.id},()=>{});GDB.collection('lb').onSnapshot(q=>{GROWS=q.docs.map(d=>d.data()).filter(Boolean);if(document.querySelector('.glb'))show('lb')},()=>{})}}catch(e){}})();
function rd(){const o=[];try{o.push(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
try{const m=document.cookie.match(/(?:^|; )orbitSave=([^;]*)/);if(m)o.push(JSON.parse(decodeURIComponent(m[1])))}catch(e){}
try{const w=JSON.parse(window.name);if(w&&w[KEY])o.push(w[KEY])}catch(e){}
try{o.push({S:JSON.parse(localStorage.getItem('orbitS')||'null')||{},c:+localStorage.getItem('ob_classic')||0,z:+localStorage.getItem('ob_zen')||0})}catch(e){}
return o}
function mg(o){for(const d of o){if(!d||typeof d!=='object')continue;mgL(d);DB.c=Math.max(DB.c,+d.c||0);DB.z=Math.max(DB.z,+d.z||0);if(d.S&&typeof d.S==='object'&&!Object.keys(DB.S).length)DB.S=d.S}}
function persist(){const j=JSON.stringify(DB);try{localStorage.setItem(KEY,j)}catch(e){}try{document.cookie=KEY+'='+encodeURIComponent(j)+';max-age=31536000;path=/;SameSite=Lax'}catch(e){}try{window.name=JSON.stringify({[KEY]:DB})}catch(e){}}
mg(rd());
const S=Object.assign({mode:'classic',skin:0,snd:1,theme:'auto',name:''},DB.S);S.name=cleanName(S.name);persist();
addEventListener('pagehide',persist);
const idLine=()=>OWN?`<p><span class="otag">${esc(OTAG)}</span>${S.name?' '+esc(S.name):''}</p>`:(S.name?`<p>${esc(S.name)}</p>`:'');
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',hexs=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),enc=t=>new TextEncoder().encode(t);
function rb32(){let b='',o='';for(const x of crypto.getRandomValues(new Uint8Array(20)))b+=x.toString(2).padStart(8,'0');for(let i=0;i<160;i+=5)o+=B32[parseInt(b.slice(i,i+5),2)];return o}
function d32(t){let b='';for(const c of t)b+=B32.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=b.length;i+=8)o.push(parseInt(b.slice(i,i+8),2));return new Uint8Array(o)}
async function totp(sec,t){const k=await crypto.subtle.importKey('raw',d32(sec),{name:'HMAC',hash:'SHA-1'},false,['sign']),c=new DataView(new ArrayBuffer(8));c.setUint32(4,Math.floor(t/30000));const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,c.buffer)),o=h[19]&15;return String((((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6)).padStart(6,'0')}
async function okCode(sec,code){for(const d of[0,-1,1])if(await totp(sec,Date.now()+d*30000)===code)return 1;return 0}
async function kdf(p,salt){const k=await crypto.subtle.importKey('raw',enc(p),'PBKDF2',false,['deriveBits']);return hexs(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc(salt),iterations:100000},k,256))}
const fails=()=>{try{return JSON.parse(localStorage.getItem('orbitFail')||'{}')}catch(e){return{}}},setF=f=>{try{localStorage.setItem('orbitFail',JSON.stringify(f))}catch(e){}};
const lockMin=()=>{const f=fails();return f.u>Date.now()?Math.ceil((f.u-Date.now())/6e4):0};
function bad(w){const f=fails();f.n=(f.n||0)+1;if(f.n>=5){f.u=Date.now()+3e5;f.n=0}setF(f);return er(f.u>Date.now()?'Too many attempts. Locked for 5 min.':'Wrong '+w+'.')}
function login(){OWN=1;OWN_UNTIL=1e15;setF({});try{localStorage.setItem('orbitOwn',OWN_UNTIL)}catch(e){}}
function signOut(){OWN=0;GOD=0;try{localStorage.removeItem('orbitOwn')}catch(e){}if(gb('classic')<UN[S.skin])S.skin=0;sv()}
const ok=t=>({k:'ok',t:'✓ '+t}),er=t=>({k:'err',t:'✗ '+t}),inf=t=>({k:'info',t}),U=n=>er('Usage: '+CMDS[n].u),ch=(a,l)=>l.includes((a[0]||'').toLowerCase())?a[0].toLowerCase():null;
const needC=()=>window.crypto&&crypto.subtle?0:er('Owner security needs HTTPS (or localhost).');
let HI=-1;const HIST=[];
const ALI={h:'help','?':'help',n:'name',m:'mode',login:'owner',logout:'lock'};
const CMDS={
help:{g:'General',u:'/help [command]',d:'List commands, or explain one.',f:a=>{const q=ALI[a[0]]||(a[0]||'').toLowerCase();if(CMDS[q])return[inf(CMDS[q].u),inf(CMDS[q].d)];const gs={};for(const[n,c]of Object.entries(CMDS)){if((c.o&&!OWN)||(c.v&&!c.v()))continue;(gs[c.g]=gs[c.g]||[]).push('/'+n)}return Object.entries(gs).map(([g,l])=>inf(g+': '+l.join(' '))).concat(inf('Tip: /help <command> · ↑ for history'))}},
name:{g:'General',u:'/name <name>',d:'Set your display name (letters, numbers, space - . _ , max 14).',f:a=>{const n=cleanName(a.join(' '));if(!n)return U('name');if(!OWN&&(/owner/i.test(n)||n.toLowerCase().includes(OTAG.toLowerCase())))return er('That name is reserved.');S.name=n;sv();pushG();return ok('Name set to '+n)}},
mode:{g:'General',u:'/mode classic|zen',d:'Switch game mode.',f:a=>{const m=ch(a,['classic','zen']);if(!m)return U('mode');S.mode=m;sv();return ok('Mode: '+m)}},
theme:{g:'General',u:'/theme auto|light|dark',d:'Change colour theme.',f:a=>{const m=ch(a,['auto','light','dark']);if(!m)return U('theme');S.theme=m;sv();theme();return ok('Theme: '+m)}},
sound:{g:'General',u:'/sound on|off',d:'Toggle sound.',f:a=>{const m=ch(a,['on','off']);if(!m)return U('sound');S.snd=m==='on'?1:0;sv();return ok('Sound '+m)}},
skin:{g:'General',u:'/skin <1-5>',d:'Pick a skin.',f:a=>{const k=Math.floor(+a[0])-1;if(!(k>=0&&k<5))return U('skin');if(!(OWN||gb('classic')>=UN[k]))return er(NM[k]+' is locked (planet '+UN[k]+' in Classic).');S.skin=k;sv();return ok('Skin: '+NM[k])}},
best:{g:'General',u:'/best',d:'Show your best scores.',f:()=>inf('Best · Classic '+DB.c+' · Zen '+DB.z)},
status:{g:'General',u:'/status',d:'Show ownership and session state.',f:()=>{return[inf('Ownership: '+(CL?'claimed · locked':'unclaimed')),inf('Session: '+(OWN?'owner · stays signed in':CL?'signed out':'none')),inf('Name: '+(S.name||'(not set)')+' · Mode: '+S.mode)]}},
clear:{g:'General',u:'/clear',d:'Clear this log.',f:()=>{cmdLog=[];return inf('Cleared.')}},
reset:{g:'General',u:'/reset confirm',d:'Wipe your scores and leaderboard.',f:a=>{if(a[0]!=='confirm')return er('This wipes your scores. Type /reset confirm.');DB.c=0;DB.z=0;DB.L={classic:[],zen:[]};try{localStorage.removeItem('ob_classic');localStorage.removeItem('ob_zen')}catch(e){}if(!OWN)S.skin=0;sv();return ok('Scores reset.')}},
claim:{g:'Owner',v:()=>!CL,u:'/claim <passcode>',d:'Claim ownership with a passcode. Once claimed it is locked.',f:async a=>{if(CL)return er('Already claimed. Ownership is locked.');const c=needC();if(c)return c;const p=a.join(' ');if(p.length<8)return er('Passcode must be 8+ characters. '+CMDS.claim.u);const salt=hexs(crypto.getRandomValues(new Uint8Array(12)));CL={s:salt,h:await kdf(p,salt)};try{localStorage.setItem('orbitOwnerV2',JSON.stringify(CL))}catch(e){}login();return[ok('Claimed and locked. Nobody can claim this again.'),inf('Owner session stays signed in. All skins unlocked.')]}},
owner:{g:'Owner',v:()=>CL&&!OWN,u:'/owner <passcode>',d:'Sign in with your passcode.',f:async a=>{if(!CL)return er('Nothing claimed yet. Use /claim <passcode>.');if(OWN)return ok('Already signed in.');const c=needC(),m=lockMin();if(c)return c;if(m)return er('Locked. Try again in '+m+' min.');if(await kdf(a.join(' '),CL.s)!==CL.h)return bad('passcode');login();return ok('Signed in as owner.')}},
lock:{g:'Owner',o:1,u:'/lock',d:'End the owner session now.',f:()=>{signOut();return ok('Locked. Sign in again with /owner.')}},
tag:{g:'Owner',o:1,u:'/tag <text>',d:'Change the owner tag (A-Z, 0-9, max 10).',f:a=>{const t=a.join(' ').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,10);if(!t)return U('tag');OTAG=t;try{localStorage.setItem('orbitTag',t)}catch(e){}return ok('Owner tag: '+t)}},
setbest:{g:'Owner',o:1,u:'/setbest classic|zen <n>',d:'Set a best score.',f:a=>{const m=ch(a,['classic','zen']),n=Math.floor(+a[1]);if(!m||!(n>=0&&n<=1e5))return U('setbest');if(m==='zen')DB.z=n;else DB.c=n;persist();return ok(m+' best = '+n)}},
god:{g:'Owner',o:1,u:'/god on|off',d:'No void; runs are not saved.',f:a=>{const m=ch(a,['on','off']);if(!m)return U('god');GOD=m==='on'?1:0;return ok('God mode '+m)}},
clearboard:{g:'Owner',o:1,u:'/clearboard',d:'Clear the leaderboard only.',f:()=>{DB.L={classic:[],zen:[]};persist();return ok('Leaderboard cleared.')}},
talk:{g:'Owner',o:1,u:'/talk <text>',d:'Broadcast a message to everyone playing right now.',f:async a=>{const t=a.join(' ').trim().slice(0,140);if(!t)return U('talk');if(!GDB)return er('Broadcast needs the shared database. Open the published page signed in.');try{await GDB.doc('broadcast/latest').set({id:Date.now()+'-'+Math.random().toString(36).slice(2,8),text:t,from:S.name||OTAG,t:Date.now()});return ok('Sent to everyone.')}catch(e){return er('Only the artifact owner can broadcast.')}}},
release:{g:'Owner',o:1,u:'/release <passcode>',d:'Give up ownership so it can be claimed again.',f:async a=>{if(await kdf(a.join(' '),CL.s)!==CL.h)return bad('passcode');CL=null;try{localStorage.removeItem('orbitOwnerV2')}catch(e){}signOut();return ok('Released. Ownership is unclaimed.')}}};
async function cmd(raw){chk();let p=raw.replace(/^\//,'').trim().split(/\s+/),n=p.shift().toLowerCase();n=ALI[n]||n;const c=CMDS[n];
if(!c){const s=Object.keys(CMDS).filter(k=>k.startsWith(n.slice(0,2)));return er('Unknown command /'+n+'.'+(s.length?' Did you mean /'+s.slice(0,3).join(', /')+'?':' Try /help.'))}
if(c.o&&!OWN)return er('Owner only. Sign in with /owner.');return c.f(p)}
async function runCmd(){const i=document.getElementById('ci'),raw=(i?i.value:'').trim();if(!raw)return;HIST.push(raw);HI=-1;const n=raw.replace(/^\//,'').split(/\s+/)[0].toLowerCase();cmdLog.push({k:'in',t:'> '+(/^(claim|owner|login|release)$/.test(n)?n+' ••••':raw)});let r;try{r=await cmd(raw)}catch(e){r=er('Something went wrong.')}cmdLog=cmdLog.concat(r).slice(-40);show('cmd')}
let best=0,AC,pm;const pb=document.getElementById('pb');
const SK=['#ff5d8f','#4dd8ff','#ffc933','#4dffb0','#b583ff'],UN=[0,5,10,20,30],NM=['Rose','Comet','Gold','Mint','Violet'];
function gb(m){m=m||S.mode;return m==='zen'?DB.z:DB.c}

for(let i=0;i<26;i++){const s=stars[i];ctx.globalAlpha=.15+.55*Math.abs(Math.sin(t*(.6+s.z*2)+s.x*9));ctx.fillStyle=col.star;ctx.fillRect(s.x*W,s.y*H,s.s*1.5,s.s*1.5)}
const R=[.34,.56,.82],HU=[300,200,40],sp=[.35,-.22,.14];
ctx.lineWidth=2;ctx.setLineDash([4,10]);
R.forEach((k,i)=>{ctx.globalAlpha=.16;ctx.strokeStyle=col.fg;ctx.lineDashOffset=-t*8*(i+1);ctx.beginPath();ctx.arc(cx,cy,m*k,0,7);ctx.stroke()});
ctx.setLineDash([]);ctx.lineDashOffset=0;
R.forEach((k,i)=>{const r=m*k,an=t*sp[i]+i*2.1,x=cx+Math.cos(an)*r,y=cy+Math.sin(an)*r,pr=10+i*5;
for(let j=1;j<=8;j++){const a2=an-Math.sign(sp[i])*j*.05;ctx.globalAlpha=.3*(1-j/9);ctx.beginPath();ctx.arc(cx+Math.cos(a2)*r,cy+Math.sin(a2)*r,3*(1-j/10)+1,0,7);ctx.fillStyle=col.fg;ctx.fill()}
const g2=ctx.createRadialGradient(x-pr*.3,y-pr*.3,pr*.1,x,y,pr);g2.addColorStop(0,`hsl(${HU[i]} 85% 75%)`);g2.addColorStop(1,`hsl(${HU[i]} 70% 45%)`);
ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(x,y,pr,0,7);ctx.fillStyle=g2;ctx.fill()});
const p=(t%9)/9,x=W*1.1-p*W*1.4,y=H*.08+p*H*.45;
const cg=ctx.createLinearGradient(x,y,x+110,y-55);cg.addColorStop(0,col.fg);cg.addColorStop(1,col.fg+'00');
ctx.globalAlpha=.55;ctx.strokeStyle=cg;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+110,y-55);ctx.stroke();ctx.lineCap='butt';
ctx.fillStyle=col.fg;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();ctx.globalAlpha=1}
function burst(x,y,n,c){for(let i=0;i<n;i++){const an=Math.random()*6.283,sp=60+Math.random()*220;parts.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:1,c})}}
function fx(dt){shake=Math.max(0,shake-dt*2.2);flash=Math.max(0,flash-dt*3.5);const m=shake*shake*14;cv.style.transform=m>.1?`translate(${(Math.random()-.5)*2*m}px,${(Math.random()-.5)*2*m}px) scale(1.03)`:'';fl.style.opacity=flash*.45;for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.4}parts=parts.filter(p=>p.l>0);for(const p of pops){p.y-=30*dt;p.l-=dt*.9}pops=pops.filter(p=>p.l>0)}
function draw(){
ctx.fillStyle=col.bg;ctx.fillRect(0,0,W,H);
ctx.fillStyle=col.star;
for(const s of stars){const y=((s.y*H-camY*s.z)%H+H)%H;ctx.globalAlpha=.5;ctx.fillRect(s.x*W,y,s.s,s.s)}
ctx.globalAlpha=1;
if(mode==='menu'){menuBg(RM?4:performance.now()/1000);requestAnimationFrame(loop);return}
ctx.save();ctx.translate(0,-camY);
for(const p of planets){if(p.dead||p.y-camY<-80||p.y-camY>H+80)continue;
if(p.t==='drift'){ctx.globalAlpha=.12;ctx.setLineDash([2,8]);ctx.strokeStyle=col.fg;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.ox-p.amp,p.y);ctx.lineTo(p.ox+p.amp,p.y);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
const g=ctx.createRadialGradient(p.x-p.r*.3,p.y-p.r*.3,p.r*.1,p.x,p.y,p.r);
g.addColorStop(0,`hsl(${p.h} 85% 75%)`);g.addColorStop(1,`hsl(${p.h} 70% 45%)`);
ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=g;ctx.fill();
ctx.beginPath();ctx.arc(p.x,p.y,p.r+CAP,0,7);ctx.strokeStyle=p===cur?col.accent:(p.t==='shrink'?'#ffb347':col.fg);
ctx.globalAlpha=p===cur?.7:(p.t==='shrink'?.4:.15);ctx.setLineDash([4,8]);ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
for(let i=0;i<trail.length;i++){ctx.globalAlpha=i/trail.length*.5;ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,2+i/5,0,7);ctx.fillStyle=SK[S.skin];ctx.fill()}
ctx.globalAlpha=1;
if(mode!=='dead'){ctx.beginPath();ctx.arc(px,py,8,0,7);ctx.fillStyle=col.fg;ctx.fill();
ctx.beginPath();ctx.arc(px,py,4,0,7);ctx.fillStyle=SK[S.skin];ctx.fill()}
for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}
ctx.font='700 18px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle=col.accent;
for(const p of pops){ctx.globalAlpha=Math.max(0,p.l);ctx.fillText(p.t,Math.min(W-90,Math.max(90,p.x)),p.y)}
ctx.globalAlpha=1;
if((S.mode==='zen'||GOD)&&voidY>1e8){ctx.restore();requestAnimationFrame(loop);return}
const vt=voidY,tm=performance.now()/400;
ctx.beginPath();ctx.moveTo(-10,camY+H+60);ctx.lineTo(-10,vt);
for(let x=-10;x<=W+10;x+=20)ctx.lineTo(x,vt+Math.sin(x/30+tm)*8);
ctx.lineTo(W+10,camY+H+60);ctx.closePath();
const vg=ctx.createLinearGradient(0,vt-10,0,vt+160);vg.addColorStop(0,col.accent);vg.addColorStop(.12,col.void);vg.addColorStop(1,col.void);
ctx.fillStyle=vg;ctx.fill();
ctx.restore();
requestAnimationFrame(loop)}
function loop(ts){const dt=Math.min(.05,(ts-(t0||ts))/1000);t0=ts;if(mode!=='menu'&&mode!=='dead')update(dt*SPD);fx(dt);draw()}
let SPD=1,CAP=46,fxT=[],fxI=0;
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:'@keyframes disco{to{filter:hue-rotate(360deg)}}'}));
const FXD={disco:'Rainbow disco for 10s',flip:'Screens flipped upside down for 10s',shake:'Earthquake for 8s',confetti:'Confetti blast',flood:'The void surges upward',slowmo:'Slow motion for 10s',turbo:'Turbo speed for 10s',bless:'A gift: huge catch rings for 12s',curse:'A curse: tiny catch rings for 12s',party:'PARTY TIME!',fortune:'Fortune',claude:'Claude says hi',calm:'Cancel all effects'};
const PICK={fortune:['A Perfect landing is in your near future.','You will tap too early. Nobody is perfect.','The void is hungry tonight.','Today’s lucky planet is the small one.','Patience beats panic. Mostly.'],claude:['Hello from Claude! Mind the void.','Claude here: you’re doing great, probably.','Claude is watching. No pressure.','Fun fact: planets never judge your launch angle.']};
function fxClear(){fxT.forEach(clearTimeout);fxT=[];clearInterval(fxI);SPD=1;CAP=46;cv.style.animation='';cv.style.rotate=''}
function fxRun(k,x){const tm=(f,ms)=>fxT.push(setTimeout(f,ms));if(!FXD[k])return;fxClear();banner(k==='claude'?'Claude':'ADMIN',x||FXD[k]);const cf=()=>{for(let i=0;i<60;i++)parts.push({x:Math.random()*W,y:camY+Math.random()*H*.4,vx:(Math.random()-.5)*120,vy:60+Math.random()*160,l:2,c:'hsl('+Math.floor(Math.random()*360)+' 90% 60%)'})};
if(k==='disco'){cv.style.animation='disco 2s linear infinite';tm(fxClear,1e4)}
else if(k==='flip'){cv.style.rotate='180deg';tm(fxClear,1e4)}
else if(k==='shake'){fxI=setInterval(()=>{shake=1},100);tm(fxClear,8e3)}
else if(k==='confetti'){for(let w=0;w<4;w++)tm(cf,w*350)}
else if(k==='party'){cv.style.animation='disco 2s linear infinite';for(let w=0;w<8;w++)tm(cf,w*1200);tm(fxClear,1e4)}
else if(k==='bless'){CAP=80;tm(fxClear,12e3)}
else if(k==='curse'){CAP=28;tm(fxClear,12e3)}
else if(k==='fortune'||k==='claude'){cf()}
else if(k==='flood'){if(S.mode!=='zen'&&!GOD&&(mode==='orbit'||mode==='fly'))voidY-=160;if(!RM)shake=1;beep(90,.4)}
else if(k==='slowmo'){SPD=.5;tm(fxClear,1e4)}
else if(k==='turbo'){SPD=1.6;tm(fxClear,1e4)}}
async function sendFx(k,x){if(!GDB){fxRun(k,x);return inf('Not signed in to the shared database: applied on your screen only.')}
try{await GDB.doc('broadcast/fx').set({id:Date.now()+'-'+Math.random().toString(36).slice(2,8),k,x:x||'',t:Date.now()});return ok('/'+k+' sent to everyone.')}catch(e){return er('Only the artifact owner can do that.')}}
for(const k in FXD)CMDS[k]={g:'Abuse',o:1,u:'/'+k,d:FXD[k]+' (everyone).',f:()=>sendFx(k,PICK[k]?PICK[k][Math.floor(Math.random()*PICK[k].length)]:'')};
theme();show(S.seen||S.name||DB.c||DB.z?'main':'tut');requestAnimationFrame(loop);
</script>
